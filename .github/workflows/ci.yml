name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install -r orchestrator/requirements.txt pytest
      - name: Run engine tests
        run: cd orchestrator && python -m pytest -q
  build-images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cellflow-orchestrator ./orchestrator
      - run: docker build -t cellflow-cv ./cv-service
