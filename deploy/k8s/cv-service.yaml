apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-service
spec:
  replicas: 1
  selector: { matchLabels: { app: cv-service } }
  template:
    metadata: { labels: { app: cv-service } }
    spec:
      containers:
        - name: cv-service
          image: cellflow-cv:latest
          ports: [{ containerPort: 8001 }]
          env:
            - { name: CV_MODE, value: "stub" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cv-service
spec:
  selector: { app: cv-service }
  ports: [{ port: 8001, targetPort: 8001 }]
